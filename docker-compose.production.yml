services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the host secret store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]
    init: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bolpay-backend:production
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the host secret store}
      JWT_SECRET: ${JWT_SECRET:?Set a unique 256-bit-or-greater JWT secret in the host secret store}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:?Choose and configure a live or sandbox gateway before deployment}
      CASHFREE_BASE_URL: ${CASHFREE_BASE_URL:?Set the gateway API base URL}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:?Set gateway client ID in the host secret store}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:?Set gateway client secret in the host secret store}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:?Set webhook signing secret in the host secret store}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the final HTTPS public URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the final HTTPS frontend origin}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTP_RETURN_TO_CLIENT: "false"
      INVITE_CODE: ${INVITE_CODE:-}
      ML_SERVICE_URL: http://ml-service:5000
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    init: true

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: bolpay-ml-service:production
    restart: unless-stopped
    networks: [app]
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the final HTTPS public URL}
        VITE_API_URL: ""
        VITE_WS_URL: ""
        NGINX_CONFIG: nginx.production.conf
    image: bolpay-frontend:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-5173}:80"
    depends_on:
      - backend
    networks: [app]
    init: true

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
