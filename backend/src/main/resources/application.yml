server:
  port: ${PORT:8080}
spring:
  application:
    name: bolpay-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bolpay}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:bolpay_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:bolpay_mock_dev_password}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 20000
      validation-timeout: 5000
      initialization-fail-timeout: 120000
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET:bolpay-local-only-jwt-secret-change-before-deploy-64chars}
  expiration: ${JWT_EXPIRATION:86400000}
payment:
  gateway: ${PAYMENT_GATEWAY:mock}
cashfree:
  base-url: ${CASHFREE_BASE_URL:${CASHFREE_HOST:http://mock-cashfree:9000}}
  client-id: ${CASHFREE_CLIENT_ID:bolpay-mock-client}
  client-secret: ${CASHFREE_CLIENT_SECRET:bolpay-mock-client-secret}
  api-version: ${CASHFREE_API_VERSION:2025-01-01}
  internal-url: ${CASHFREE_BASE_URL:${CASHFREE_HOST:http://mock-cashfree:9000}}
  webhook-secret: ${CASHFREE_WEBHOOK_SECRET:bolpay-mock-webhook-secret}
public:
  base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
order:
  slow-after: ${SLOW_AFTER:60}
  expire-after: ${EXPIRE_AFTER:150}
  escalate-after: ${ESCALATE_AFTER:240}
  reconciliation-check-ms: ${RECONCILIATION_CHECK_MS:25000}
  reconcile-min-age-seconds: ${RECONCILE_MIN_AGE_SECONDS:10}
  expiry-check-ms: ${EXPIRY_CHECK_MS:30000}
vendor:
  high-value-threshold: ${HIGH_VALUE_THRESHOLD:1000}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
otp:
  return-to-client: ${OTP_RETURN_TO_CLIENT:false}
  demo-enabled: ${DEMO_OTP:false}
registration:
  invite-code: ${INVITE_CODE:}
security:
  trusted-proxies: ${TRUSTED_PROXIES:}
ml-service:
  url: ${ML_SERVICE_URL:http://ml-service:5000}
  api-key: ${ML_API_KEY:}
fraud:
  rule-timeouts-15m: ${FRAUD_RULE_TIMEOUTS_15M:3}
